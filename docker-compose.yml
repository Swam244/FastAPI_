version: '3'
services:
  api:
    build: .
    ports:
      - "8025:8000"
    volumes:
      - ./:/usr/src/app:ro
    command: python server_ssl.py
    depends_on:
      - postgres

    env_file:
      - .env

  postgres:
    image: postgres
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=fastapi
    volumes:
      - postgres-db:/var/lib/postgresql/data

volumes:
  postgres-db: